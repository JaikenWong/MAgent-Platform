spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  application:
    name: magent-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:magent}
    username: ${POSTGRES_USER:magent}
    password: ${POSTGRES_PASSWORD:magent_dev_pwd}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 1

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.magent.platform.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-not-delete-value: '0'

# ───────── 业务配置 ─────────
magent:
  jwt:
    secret: ${JWT_SECRET:magent-dev-jwt-secret-at-least-32-bytes-long-please}
    ttl-minutes: 720
  crypto:
    aes-key: ${CRYPTO_AES_KEY:0123456789abcdef0123456789abcdef}
  default-admin:
    username: ${DEFAULT_ADMIN_USERNAME:admin}
    password: ${DEFAULT_ADMIN_PASSWORD:admin123}
  dify:
    base-url: ${DIFY_BASE_URL:http://dify.local:3001/v1}
  llm:
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gpt-4o-mini}
  feishu:
    base-url: ${FEISHU_BASE_URL:https://open.feishu.cn/openapis}
  public-base-url: ${MAGENT_PUBLIC_BASE_URL:http://localhost:8080}

logging:
  level:
    com.magent.platform: INFO
    org.springframework.security: INFO
    org.flywaydb: INFO